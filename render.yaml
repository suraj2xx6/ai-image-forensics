services:
  - type: web
    name: ai-image-forensics
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MAX_UPLOAD_MB
        value: 15
      - key: MAX_IMAGE_PIXELS
        value: 20000000
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: MODEL_PATH
        value: models/baseline.joblib
      - key: DATABASE_URL
        value: sqlite:///reports/analyses.sqlite3
      - key: LOG_LEVEL
        value: INFO
      - key: APP_VERSION
        value: 0.1.0
